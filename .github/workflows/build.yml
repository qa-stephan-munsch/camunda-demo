name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # unit tests and process tests (the Camunda engine runs in Docker via Testcontainers)
      - name: Build and test
        run: ./mvnw --batch-mode verify

      - name: Keep test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */target/surefire-reports/
            */target/coverage-report/
          if-no-files-found: ignore
